<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>
            Login - Sistema de Controle e Manutenção de Equipamentos
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="../../css/style.css">
    </head>
    <body class="bg-light">
        <div class="d-flex flex-column justify-content-between min-vh-100 login-overlay">
            <div class="container my-auto">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                        <div class="card shadow-sm p-2">
                            <div class="card-body">
                                <h4 class="card-title mb-3">
                                    Faça seu Login
                                </h4>

                                <form id="formLogin">
                                    <div class="mb-3">
                                        <label class="form-label"
                                               for="inputEmailFormLogin">
                                            E-mail
                                        </label>
                                        <input id="inputEmailFormLogin"
                                               class="form-control"
                                               type="email" 
                                               required
                                               placeholder="Digite seu e-mail">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label"
                                               for="inputPasswordFormLogin">
                                            Senha
                                        </label>
                                        <input id="inputPasswordFormLogin"
                                               class="form-control"
                                               type="password"
                                               required
                                               placeholder="Digite sua senha">
                                    </div>

                                    <button class="btn btn-primary w-100"
                                            type="submit">
                                        Entrar
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="footerPlaceholder"
                 class="w-100">
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
                crossorigin="anonymous">
        </script>
        <script type="module"
                src="./js/components/components.js">
        </script>
    </body>
</html>
