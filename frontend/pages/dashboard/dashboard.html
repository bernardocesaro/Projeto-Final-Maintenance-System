<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>
            Dashboard - Sistema de Controle e Manutenção de Equipamentos
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="../../css/style.css">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row">
                <div id="menuPlaceholder"
                     class="col-md-3 col-lg-2 min-vh-100 bg-dark text-white">
                </div>

                <main class="col-md-9 col-lg-10 p-4">
                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>
                                        Equipamentos Ativos
                                    </h6>
                                    <h2 id="activeEquipmentsTotal">
                                        00
                                    </h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>
                                        Manutenção Preventiva
                                    </h6>
                                    <h2 id="preventiveEquipmentsTotal">
                                        00
                                    </h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>
                                        Em Manutenção
                                    </h6>
                                    <h2 id="manutenanceEquipmentsTotal">
                                        00
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>
                                        Equipamento
                                    </th>
                                    <th>
                                        Local
                                    </th>
                                    <th>
                                        Status
                                    </th>
                                    <th>
                                        Ações
                                    </th>
                                </tr>
                            </thead>

                            <tbody id="equipmentsTable">
                                <tr>
                                    <td>
                                        Empacotadora
                                    </td>
                                    <td>
                                        Setor Peru A1
                                    </td>
                                    <td>
                                        Ativos
                                    </td>
                                    <td>
                                        Nenhuma Ação Disponível
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        Empacotadora Bandeja
                                    </td>
                                    <td>
                                        Setor Peru A1
                                    </td>
                                    <td>
                                        Manutenção
                                    </td>
                                    <td>
                                        Nenhuma Ação Disponível
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </main>

                <div id="equipmentModal"
                     class="modal fade"
                     tabindex="-1"
                     aria-hidden="false">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Novo Equipamento
                                </h5>

                                <button class="btn-close"
                                        type="button"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">
                                <input id="equipmentName"
                                       class="form-control"
                                       type="text"
                                       placeholder="Nome do Equipamento">
                                <button id="btnSaveEquipment"
                                        class="btn btn-success"
                                        type="button">
                                    Salvar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="footerPlaceholder"
                 class="w-100">
            </div>
        </div>

        <script type="module"
            src="../../js/components/components.js">
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
                crossorigin="anonymous">
        </script>
    </body>
</html>
