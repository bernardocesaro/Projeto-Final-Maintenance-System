<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>
            Consulta de Categorias - Sistema de Controle e Manutenção de Equipamentos
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="../../css/style.css">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row">
                <div id="menuPlaceholder"
                     class="col-md-3 col-lg-2 min-vh-100 bg-dark text-white">
                </div>

                <div class="col-md-9 col-lg-10 d-flex flex-column min-vh-100">
                    <main class="flex-grow-1 p-4">
                        <div id="searchPlaceholder">
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead id="categoryTableHead">
                                </thead>

                                <tbody id="categoryTableBody">
                                </tbody>
                            </table>
                        </div>

                        <div class="row">
                            <button id="btnNewEquipment"
                                    class="btn btn-primary">
                                Novo Equipamento
                            </button>
                        </div>
                    </main>

                    <div id="footerPlaceholder"
                         class="w-100">
                    </div>
                </div>

                <div id="equipmentModal"
                     class="modal fade"
                     tabindex="-1"
                     aria-hidden="false">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Novo Equipamento
                                </h5>

                                <button class="btn-close"
                                        type="button"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">
                                <input id="equipmentName"
                                       class="form-control"
                                       type="text"
                                       placeholder="Nome do Equipamento">
                                <button id="btnSaveEquipment"
                                        class="btn btn-success"
                                        type="button">
                                    Salvar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
                crossorigin="anonymous">
        </script>
        <script type="module"
                src="../../js/components/components.js">
        </script>
        <script type="module"
                src="../../js/views/categoryView.js">
        </script>
    </body>
</html>
